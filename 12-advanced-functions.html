    // filter
    [1, -3, 5].filter((value, index) => {
        if (value >= 0) {
            return true;
        } else {
            return false;
        }
        // mesma coisa que em cima
        return value >= 0;
    })

    // map
    [1, 1, 3].map((value, index) => {
        // return value + 10; == [11, 11, 13]
        return value * 2 == [2, 2, 6]
    });

    [1, 1, 3].map(value => value * 2); // == [2, 2, 6]
