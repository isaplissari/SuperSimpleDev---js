<!DOCTYPE html>
<html>
<head>
    <title>dom projects</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;

        }
        .js-sub-btn {
            border: none;
            background-color: black;
            color: white;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 15px;
            padding-right: 15px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .is-subscribed {
            background-color: rgb(240, 240, 240);
            color: black;
        }

        .cost-input {
            font-size: 15px;
            padding: 10px;

        }

        .calculate-btn {
            background-color: green;
            color: white;
            border: none;
            font-size: 15px;
            padding: 12px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <p>youtube subscribe button</p>
    <button onclick="subscribe()" class="js-sub-btn">subscribe</button>
    
    <p>amazon shipping calculator</p>
    <input placeholder="cost of order" class="js-input cost-input" onkeydown="handleCostKeydown(event)">
    <button onclick="calculateTotal()" class="calculate-btn">calculate</button>
    <p class="js-total"></p>

    <script>

        function handleCostKeydown(event) {
            if (event.key === 'Enter') {
        calculateTotal();
        }
        }

        function subscribe() {
            const btnEl = document.querySelector('.js-sub-btn');

        if (btnEl.innerText === 'subscribe') {
            btnEl.innerText = 'subscribed';
            btnEl.classList.add('is-subscribed');
        } else {
            btnEl.innerText = 'subscribe';
            btnEl.classList.remove('is-subscribed');
        }
        }

        function calculateTotal() {
            const inputEl = document.querySelector('.js-input');
            let cost = Number(inputEl.value); // transforma a string em numero

            if (cost < 40) {
                cost += 10
            }
            
            document.querySelector('.js-total').innerHTML = `$${cost}`;
        }

    </script>
</body>
</html>
