<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="css files/12-rps.css">
  </head>
  <body>

    <p class="title">Rock Paper Scissors</p>

    <button class="move-btn js-rock-btn">
    <img src="images/rock-emoji.png" class="move-icon">
  </button>

    <button onclick="
      playGame('paper'); "
      class="move-btn js-paper-btn">
    <img src="images/paper-emoji.png" class="move-icon">
  </button>

    <button onclick="
      playGame('scissors'); "
      class="move-btn js-scissors-btn">
    <img src="images/scissors-emoji.png" class="move-icon">
  </button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');
      updateScoreEl();
    " class="reset-score-btn">Reset Score</button>

    <button class="auto-play-btn" onclick="
      autoPlay()
    ">Auto Play</button>

  <script src="javascript files/12-rps.js"></script>

  </body>
</html>
