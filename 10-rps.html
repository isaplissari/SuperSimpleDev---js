<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="10-rps.css">
  </head>
  <body>

    <p class="title">Rock Paper Scissors</p>

    <button onclick="
      playGame('rock'); "
      class="move-btn">
    <img src="rock-emoji.png" class="move-icon">
  </button>

    <button onclick="
      playGame('paper'); "
      class="move-btn">
    <img src="paper-emoji.png" class="move-icon">
  </button>

    <button onclick="
      playGame('scissors'); "
      class="move-btn">
    <img src="scissors-emoji.png" class="move-icon">
  </button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');
      updateScoreEl();
    " class="reset-btn">Reset Score</button>

  <script src="10-rps.js"></script>

  </body>
</html>
